# ============================================================================
# BA3D 查看器 —— nginx 配置片段
# 站点：api.sample.site    目录：/3d-viewer/    访问：https://api.sample.site/3d-viewer/
#
# 用法：把下面「主块」整段放进 api.sample.site 的 server { } 里即可。
#       文件本身不需要任何修改（所有引用都是相对路径）。
# ============================================================================


# ---------------------------------------------------------------------------
# 0) 前置：让 .glb 有正确的 MIME
#
#    推荐做法 —— 直接在全局 mime.types 里加一行（最省事、无副作用）：
#        编辑 /etc/nginx/mime.types，在 types { } 里加：
#            model/gltf-binary  glb;
#        然后 nginx -t && systemctl reload nginx
#
#    如果你不想动全局文件，也可以只在 server 块里补，但**必须 include 标准表**，
#    否则 types { } 会整体覆盖继承来的表，html / css / png 全部变成
#    application/octet-stream（浏览器会直接下载而不是显示页面）：
#
#        types {
#            include mime.types;          # ← 这一行不能少
#            model/gltf-binary glb;
#        }
#
#    （没有配也对：GLTFLoader 不看 Content-Type。但部分 CDN / 中间层会拦。）
# ---------------------------------------------------------------------------


# ---------------------------------------------------------------------------
# 1) 结尾斜杠重定向 —— 子目录部署最关键的一条
#
#    路径是 /3d-viewer（无斜杠）时，浏览器会把 "3d-viewer" 当成文件，
#    于是 index.html 里的相对路径 ./vendor/three/... 会解析成
#    /vendor/three/...（跑到站点根目录）→ 全部 404、白屏。
#
#    nginx 通常会自动 301 补斜杠，但显式写死最保险。
# ---------------------------------------------------------------------------
location = /3d-viewer {
    return 301 /3d-viewer/;
}


# ---------------------------------------------------------------------------
# 2) 主块
# ---------------------------------------------------------------------------
location /3d-viewer/ {
    # 情况 A：文件就放在站点根目录下的 3d-viewer 文件夹里
    #         （即 <root>/3d-viewer/index.html）
    #         这种情况用 root 即可，不用写这一行，继承 server 的 root 就行。
    #
    # 情况 B：文件放在别处，例如 /var/www/3d-viewer/
    #         那就解开下面这行（注意 alias 和 location 的结尾斜杠必须都写）：
    #
    # alias /var/www/3d-viewer/;

    index index.html;
    try_files $uri $uri/ =404;

    # 模型 / 贴图 / 库文件长缓存
    location ~* \.(glb|png|js|mjs)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 配置 json 不缓存 —— 配置是运行时读取的，缓存住就会出现「改了没生效」
    location ~* \.json$ {
        add_header Cache-Control "no-cache";
    }
}


# ---------------------------------------------------------------------------
# 3) gzip（可选）
#    .glb 本身是二进制，压不动，不要加进来
# ---------------------------------------------------------------------------
gzip on;
gzip_min_length 1024;
gzip_types text/html text/css application/javascript image/svg+xml;


# ---------------------------------------------------------------------------
# 4) CORS（可选）
#    只有当你打算让**别的网站**用 <script type="module"> 引
#    /3d-viewer/dist/ba3d-viewer.min.js 时才需要 —— ES module 跨域受 CORS 限制。
#    自己站点内用 index.html / embed-demo.html 不需要。
# ---------------------------------------------------------------------------
# location /3d-viewer/dist/ {
#     add_header Access-Control-Allow-Origin "*";
#     add_header Cache-Control "public, max-age=31536000, immutable";
# }


# ============================================================================
# 部署步骤
# ============================================================================
# 1. 上传：把部署包里的全部内容传到 /var/www/api.sample.site/3d-viewer/
#      （或你 alias 指向的目录），目录结构不要改：
#
#          3d-viewer/
#          ├── index.html
#          ├── viewer.js
#          ├── vendor/three/...
#          ├── assets/
#          │   ├── xiaoxia.glb  xiaoxia.json
#          │   ├── oumali.glb   oumali.json
#          │   ├── yuni.glb     yuni.json
#          │   ├── bandxiaoxia.glb  bandxiaoxia.json
#          │   ├── Hoshino_Original.glb  Hoshino_Original.json
#          │   └── mouth/*.png
#          └── dist/（可选，给别人嵌入用）
#
# 2. 权限：确保 nginx 运行用户（通常 www-data / nginx）能读
#      chown -R www-data:www-data /var/www/api.sample.site/3d-viewer
#      find /var/www/api.sample.site/3d-viewer -type d -exec chmod 755 {} \;
#      find /var/www/api.sample.site/3d-viewer -type f -exec chmod 644 {} \;
#
# 3. 校验并重载
#      nginx -t && systemctl reload nginx
#
# 4. 访问（注意结尾斜杠）
#      https://api.sample.site/3d-viewer/
#      https://api.sample.site/3d-viewer/?config=./assets/Hoshino_Original.json
#
# ============================================================================
# 自检清单
# ============================================================================
#   curl -I https://api.sample.site/3d-viewer            → 301 到 .../3d-viewer/
#   curl -I https://api.sample.site/3d-viewer/           → 200
#   curl -I https://api.sample.site/3d-viewer/vendor/three/three.module.js   → 200
#   curl -I https://api.sample.site/3d-viewer/assets/xiaoxia.glb             → 200
#   curl -I https://api.sample.site/3d-viewer/assets/xiaoxia.json            → 200 + no-cache
#
# 浏览器 F12 若报 "Failed to resolve module specifier" → 说明没走 /3d-viewer/，
# 检查是否漏了结尾斜杠。
# ============================================================================
