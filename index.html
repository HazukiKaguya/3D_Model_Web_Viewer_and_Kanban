<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>3D 模型查看器 · BA 模型特化</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    /* 查看器背景默认透明，所以这里就是「下方网页内容」 */
    background: radial-gradient(120% 90% at 50% 0%, #1c2434 0%, #0b0e15 72%);
  }
  #app { position: absolute; inset: 0; touch-action: none; }
  /* 暗角：跟着场景窗口（absolute、不再是整页 fixed。） */
  #vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(circle at 50% 40%, transparent 40%, rgba(0,0,0,.55) 100%);
  }
  /* #hud 现在是「工具栏」浮窗**里面**的内容（不再是 fixed 整页浮层。） */
  #hud {
    position: static;
    display: flex; gap: 8px; flex-wrap: wrap; align-content: flex-start;
    font: 13px/1.4 system-ui, -apple-system, "PingFang SC", sans-serif;
    color: #cfd3dc;
  }
  #hud button {
    padding: 7px 13px; border: 1px solid rgba(255,255,255,.18);
    border-radius: 8px; background: rgba(22,26,34,.72);
    color: inherit; cursor: pointer; backdrop-filter: blur(8px);
    transition: background .15s, border-color .15s, color .15s;
  }
  #hud button:hover { background: rgba(50,58,74,.85); border-color: rgba(255,255,255,.32); }
  #hud button.on { background: #3d6fe0; border-color: #5b8cf5; color: #fff; }
  #hud .sep { width: 1px; background: rgba(255,255,255,.15); margin: 0 4px; }
  #hud label {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: #cfd3dc;
  }
  #hud select, #hud input[type=color] {
    padding: 6px 8px; border: 1px solid rgba(255,255,255,.18);
    border-radius: 8px; background: rgba(22,26,34,.72); color: #cfd3dc;
    cursor: pointer; font: 13px system-ui, sans-serif; backdrop-filter: blur(8px);
  }
  #hud select { max-width: 180px; }
  #hud input[type=color] { width: 34px; height: 30px; padding: 2px; }
  #hud input[type=range] { width: 90px; vertical-align: middle; }
  #hud input[type=number] { width: 64px; vertical-align: middle; }
  #hud option { background: #151a26; color: #cfd3dc; }
  #loading {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; background: #10131a; color: #8b93a7;
    font: 14px system-ui, sans-serif; transition: opacity .4s;
  }
  #loading.hide { opacity: 0; pointer-events: none; }
  #bar { width: 220px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.1); overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0%; background: #5b8cf5; transition: width .2s; }
  /* #info 现在是「状态」浮窗里面的内容 */
  #info {
    position: static;
    font: 12px/1.6 ui-monospace, monospace; color: #6b7385;
    white-space: pre-wrap; word-break: break-all;
  }

  /* ---------- 自定义模型：本地文件上传 ---------- */
  #upload {
    position: fixed; left: 16px; top: 16px; z-index: 12;
    width: 288px; padding: 14px;
    border: 1px solid rgba(255,255,255,.14); border-radius: 12px;
    background: rgba(18,22,30,.82); backdrop-filter: blur(10px);
    font: 12.5px/1.5 system-ui, -apple-system, "PingFang SC", sans-serif;
    color: #cfd3dc;
    box-shadow: 0 12px 40px rgba(0,0,0,.4);
  }
  #upload.hidden { display: none; }

  /* 右侧浮层面板（lilToon 参数 / 导出配置共用）*/
  .lp {
    /* ⚠️ z-index 必须高于 #upload（12 ）
       两者都在 top:16px、且 #upload 在 DOM 里排在 #lilPanel 之后 
       同层级时后出现的在上、于是窗口不够宽时自定义模型选单会盖住参数面板 
       表现就是「点了像没反应」，其实面板已经打开了。 */
    position: fixed; right: 16px; top: 16px; z-index: 15;
    width: 400px; max-height: calc(100vh - 32px);
    overflow-y: auto; overflow-x: hidden;   /* 不要左右滚轮 */
    padding: 14px;
    border: 1px solid rgba(255,255,255,.14); border-radius: 12px;
    background: rgba(18,22,30,.86); backdrop-filter: blur(10px);
    font: 12.5px/1.5 system-ui, -apple-system, "PingFang SC", sans-serif;
    color: #cfd3dc;
    box-shadow: 0 12px 40px rgba(0,0,0,.4);
  }
  /**
   * ★★ 面板缩放改用 **CSS 原生 `resize`** ——
   *
   *   ⚠️⚠️ 原来走 JS 手柄（`makePanelResizable` 运行时 `appendChild` 一个 `.fw-grip`）
   *     但**面板内容会被反复重建**（`buildPartsPanel` 里 `innerHTML = ''`。）⇒
   *     手柄被一起删掉、800ms 的扫描**也没补回来**（实测：打开部件后 手柄数 0。）
   *     ⇒ 用户看到的就是「部件 panel 不能调大小」。
   *
   *   ⇒ CSS 的 `resize` 是**浏览器原生**的、不依赖 DOM 里有没有手柄元素
   *     ⇒ 重建多少次都不受影响。（虽然不做持久化、但至少**能用**。）
   *
   *   ⚠️ `resize` 要求 `overflow` 不是 `visible` ⇒ 一起给上。
   *   ⚠️ 给个 `min-width/min-height`、不然能拖到看不见。
   */
  .lp { resize: both; overflow: auto; min-width: 220px; min-height: 80px; }
  .lp.hidden { display: none; }
  /* 部件面板放左侧，避开右上的 lilToon / 导出面板与左上的自定义模型选单 */
  .lp.parts { left: 16px; right: auto; top: 300px; width: 340px; max-height: calc(100vh - 320px); }
  .lp .mrow { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; font-size: 11.5px; }
  .lp .mrow input[type=checkbox] { flex: 0 0 auto; }
  .lp .mrow .mname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lp .mrow .mtri { flex: 0 0 auto; color: #6b7385; font-size: 10.5px; }
  .lp .mrow button { flex: 0 0 auto; padding: 1px 6px; font-size: 10.5px; }
  .lp h4 { margin: 12px 0 6px; font-size: 12px; color: #8fa4c8; font-weight: 600; }
  .lp h4:first-child { margin-top: 0; }
  /* —— 面板标题栏：同时充当拖拽把手 —— */
  .lp .lp-title {
    /* 负外边距抵消 .lp 的 padding、让标题栏贴满顶部。 */
    margin: -14px -14px 10px; padding: 9px 14px;
    background: rgba(255,255,255,.055);
    border-radius: 11px 11px 0 0;
    border-bottom: 1px solid rgba(255,255,255,.09);
    font-weight: 600; font-size: 12.5px; color: #c3ccdd;
    cursor: move; user-select: none;
    /* 触屏：告诉浏览器这一块自己处理手势，别当成滚动，否则拖动会被 pointercancel 打断 */
    touch-action: none;
    position: sticky; top: -14px; z-index: 2;
    display: flex; align-items: center; gap: 6px;
  }
  .lp .lp-title:active { cursor: grabbing; }
  .lp .lp-title .lp-dot { width: 7px; height: 7px; border-radius: 50%; background: #3d6fe0; flex: 0 0 auto; }
  /* 标题区可按住拖动面板（监听挂在面板上用事件委托、重建面板也不会失效）*/
  .lp h4 { cursor: move; }
  .lp h4:active { cursor: grabbing; }
  .lp .row { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
  .lp .row > span { flex: 0 0 74px; color: #9aa3b5; }
  .lp .row input[type=range] { flex: 1; min-width: 0; }
  .lp .row input[type=number] { width: 52px; flex: 0 0 auto; }
  .lp .row input[type=text] { flex: 1; min-width: 0; }
  .lp .hint { margin: 6px 0 10px; font-size: 11px; color: #6b7385; }
  .lp textarea {
    width: 100%; height: 150px; margin-top: 8px; resize: vertical;
    background: #0e1117; color: #b9c2d0; border: 1px solid rgba(255,255,255,.12);
    border-radius: 6px; padding: 8px; font: 11px/1.4 ui-monospace, Consolas, monospace;
  }
  .lp .actions { display: flex; gap: 8px; margin-top: 10px; }
  .lp button {
    flex: 1; padding: 6px 10px; border-radius: 7px; cursor: pointer;
    background: rgba(38,44,56,.9); color: #cfd3dc;
    border: 1px solid rgba(255,255,255,.14); font-size: 12px;
  }
  .lp button:hover { background: rgba(50,58,74,.95); }
  .lp button.primary { background: #3d6fe0; border-color: #5b8cf5; color: #fff; }
  /* —— 统一标题栏（.lp-title 与 #upload .u-title 同一套视觉）—— */
  #upload .u-title {
    font-size: 12.5px; font-weight: 600; color: #c3ccdd;
    margin-bottom: 10px; padding-bottom: 9px;
    border-bottom: 1px solid rgba(255,255,255,.09);
    cursor: move; user-select: none;
    touch-action: none;   /* 触屏：同上，交给我们自己处理拖动 */
    display: flex; align-items: center; gap: 6px;
  }
  #upload .u-title:active { cursor: grabbing; }
  #upload .u-title::before {
    content: ''; width: 7px; height: 7px; border-radius: 50%;
    background: #3d6fe0; flex: 0 0 auto;
  }
  #upload .u-row { margin-bottom: 9px; }
  #upload .u-pick {
    display: block; padding: 7px 10px; cursor: pointer;
    border: 1px dashed rgba(255,255,255,.22); border-radius: 8px;
    background: rgba(255,255,255,.03); color: #cfd3dc;
    transition: border-color .15s, background .15s;
  }
  #upload .u-pick:hover { border-color: rgba(91,140,245,.7); background: rgba(91,140,245,.10); }
  #upload .u-pick input[type=file] { display: none; }
  #upload .u-pick em { color: #6b7385; font-style: normal; font-size: 11px; }
  #upload .u-name {
    margin: 4px 2px 0; font-size: 11px; color: #6b7385;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #upload .u-name.has { color: #7de0a8; }
  #upload .u-actions { display: flex; gap: 8px; margin-top: 12px; }
  #upload .u-actions button {
    flex: 1; padding: 8px 10px; cursor: pointer;
    border: 1px solid rgba(255,255,255,.18); border-radius: 8px;
    background: rgba(34,40,52,.9); color: #cfd3dc;
    font: 12.5px system-ui, sans-serif;
    transition: background .15s, border-color .15s;
  }
  #upload .u-actions button:hover:not(:disabled) { background: rgba(50,58,74,.95); border-color: rgba(255,255,255,.34); }
  #upload .u-actions button.primary { background: #3d6fe0; border-color: #5b8cf5; color: #fff; }
  #upload .u-actions button.primary:hover:not(:disabled) { background: #4a7cf0; }
  #upload .u-actions button:disabled { opacity: .45; cursor: not-allowed; }
  #upload .u-msg { margin-top: 9px; font-size: 11px; color: #7de0a8; min-height: 14px; word-break: break-all; }
  /* ============================================================
   * 浮窗底座（fw = floating window）
   *
   * 目标：像 Unity 那样 —— 场景是一个浮窗 · 参数面板是另一个浮窗 ·
   *       互不嵌套 · 都能拖动和缩放。
   *
   * ⚠️ 为什么场景也要浮窗化：
   *   frameModel() 按 **container.clientHeight** 把模型缩放到固定像素高。
   *   而 #app 原来是 position:fixed; inset:0（铺满视口。）⇒
   *   浏览器窗口一变扁 ⇒ clientHeight 变小 ⇒ **模型跟着缩** · 很意外。
   *   固定尺寸的浮窗 ⇒ clientHeight 恒定 ⇒ 模型大小恒定。
   *   （⚠️ 用户**主动**缩放场景窗口时仍会重新取景 ——
   *     这是预期行为 · Unity 的 Scene 视图也是这样。）
   * ============================================================ */
  .fw {
    position: fixed; z-index: 8;
    display: flex; flex-direction: column;
    background: #14161c;
    border: 1px solid #2b3040; border-radius: 8px;
    box-shadow: 0 10px 34px rgba(0,0,0,.5);
    overflow: hidden;
    min-width: 240px; min-height: 160px;
  }
  .fw.hidden { display: none; }
  .fw.dragging, .fw.resizing { user-select: none; }
  .fw.raised { z-index: 30; }
  .fw-title {
    flex: 0 0 auto; height: 26px;
    display: flex; align-items: center; gap: 6px;
    padding: 0 8px;
    font-size: 11.5px; color: #9fb0cc; font-weight: 600;
    background: linear-gradient(#20242e, #191c24);
    border-bottom: 1px solid #2b3040;
    cursor: move; touch-action: none;
  }
  .fw-title .fw-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fw-title .fw-btn {
    flex: 0 0 auto; padding: 0 6px; height: 18px; line-height: 16px;
    font-size: 11px; background: #262b37; color: #9fb0cc;
    border: 1px solid #333a4a; border-radius: 4px; cursor: pointer;
  }
  .fw-title .fw-btn:hover { background: #313847; color: #d6e2f5; }
  .fw-body { flex: 1 1 auto; position: relative; min-height: 0; overflow: hidden; }
  /**
   * ⚠️⚠️ **场景窗口永远在最底层**（用户要求）——
   *
   *   原来它是 z-index 8，看着是低的 ✓ 但 `fwRaise()` 会给被点到的窗口加 `.raised`
   *   （`.fw.raised { z-index: 30 }`）**场景也算** ⇒
   *   一旦点过场景（或拖动过它。）它就升到 30，
   *   而参数面板 `.lp` 只有 15、`#scenePanel` 只有 16 ⇒
   *   **面板被画在画布底下，用户「点了场景按钮却看不到面板」** ✓
   *
   *   ⇒ 场景降到 1（所有浮窗 / 面板都在 10 以上 ✓）
   *     并加一条 `.raised` 的兜底：即使类被加上去也不改变层级 ✓
   *     （`fwRaise()` 里也做了跳过。）
   */
  /* ⚠️ `!important` 是**必须的**：提升机制写的是内联 z-index，样式表不加 !important 压不住 */
  #sceneWin { left: 16px; top: 16px; width: 960px; height: 700px; z-index: 1 !important; }
  #sceneWin.raised { z-index: 1 !important; }   /* 兜底：场景不接受「提到最前」 */
  #sceneWin .fw-body { background: #0d0f13; }
  .fw-grip {
    position: absolute; right: 0; bottom: 0; width: 16px; height: 16px;
    cursor: nwse-resize; touch-action: none; z-index: 3;
    background:
      linear-gradient(135deg, transparent 0 46%, #4a5468 46% 54%, transparent 54%),
      linear-gradient(135deg, transparent 0 68%, #4a5468 68% 76%, transparent 76%);
  }
  .fw-grip:hover { filter: brightness(1.6); }
  /* 工具栏浮窗（收纳 #hud 的按钮 + 各种滑杆。） */
  /*
   * ⚠️ 高度是**截图实测**调出来的 —— 210px 时最下面一行控件（光照夹取 / 渲染。）
   *    会被裁掉、虽然 body 能滚、但看起来像「控件没了」
   *    300px 能完整放下（16 组控件 + 折行。）
   */
  /*
   * 高度用 **min(绝对值, 视口百分比)** —— 截图实测：
   *   210px ⇒ 裁掉 2 行 · 300px ⇒ 还裁 1 行（骨骼 / 顶点色 / 部件 / 描边 那排。）
   *   固定值在矮屏上会顶出视口 ⇒ 用 min() 兼顾两边。
   * ⚠️ body 本来就有 overflow-y:auto ⇒ 裁了也能滚、但看起来像「控件没了」
   */
  #hudWin { left: 16px; bottom: 16px; width: 680px; height: min(400px, 46vh); z-index: 10; }
  #hudWin .fw-body { overflow-y: auto; overflow-x: hidden; padding: 8px 10px; }
  /* 状态浮窗（#info。） */
  /* 场景设置浮窗：放左上 · 避开右边的 lilToon / 导出面板 */
  #scenePanel { left: 16px; top: 16px; width: 364px; max-height: calc(100vh - 32px); z-index: 16; }
  #scenePanel .sp-row { display: flex; align-items: center; gap: 6px; margin: 3px 0; font-size: 11.5px; }
  #scenePanel .sp-row > span:first-child { flex: 0 0 86px; color: #8fa4c8; }
  #scenePanel .sp-row input[type=range] { flex: 1; min-width: 0; }
  #scenePanel .sp-row input[type=number] { flex: 0 0 62px; }
  #scenePanel .sp-row input[type=color] { flex: 0 0 34px; height: 20px; padding: 0; }
  #scenePanel .sp-row select { flex: 1; min-width: 0; }
  #scenePanel .sp-row button { flex: 0 0 auto; padding: 3px 8px; font-size: 11px; }
  #scenePanel .sp-grp { margin: 10px 0 4px; font-size: 12px; color: #8fa4c8; font-weight: 600; }
  #scenePanel .sp-grp:first-child { margin-top: 0; }
  #scenePanel .sp-chk { flex: 0 0 auto; margin: 0 3px 0 0; }
  body.light #scenePanel .sp-row > span:first-child { color: #43536e; }
  body.light #scenePanel .sp-grp { color: #43536e; }
  #infoWin { right: 16px; bottom: 16px; width: 300px; height: min(150px, 20vh); z-index: 10; }
  #infoWin .fw-body { overflow-y: auto; padding: 8px 10px; }
  /* .lp 面板的缩放手柄在右下角 ⇒ 留点内边距别压住最后一行。 */
  .lp { padding-bottom: 14px; }
  /* ============================================================
   * 窄屏 / 矮屏兜底 —— 浮窗在手机上不实用 ⇒ 退回铺满
   *
   * ⚠️ 这个文件原来**一个 @media 都没有**（纯桌面布局。）
   *    浮窗化之后必须补：否则手机上场景只有 960×700 的一小块 
   *    参数面板也只有 400px 宽 ⇒ 完全没法用。
   *
   * 策略：
   *   · 场景浮窗 ⇒ 铺满视口 · 去掉边框圆角 · 隐藏标题栏和手柄（拖不动也没关系。）
   *   · 参数面板 ⇒ 全屏覆盖（它本来就有滚动。）
   *   · 工具栏 / 状态 ⇒ 变成底部两条（不遮住整个场景。）
   * ============================================================ */
  @media (max-width: 820px), (max-height: 560px) {
    #sceneWin {
      left: 0 !important; top: 0 !important;
      width: 100vw !important; height: 100vh !important;
      border: none !important; border-radius: 0 !important;
    }
    /* 标题栏是拖拽把手、窄屏没地方放 ⇒ 隐藏（手柄同理。） */
    .fw-title { display: none !important; }
    .fw-grip { display: none !important; }
    .fw { border-radius: 0 !important; }
    /* 参数面板 / 导出 / 部件：全屏覆盖（它们内部本来就能滚。） */
    .lp {
      left: 0 !important; top: 0 !important; right: auto !important; bottom: auto !important;
      width: 100vw !important; max-width: 100vw !important;
      height: 100vh !important; max-height: 100vh !important;
      border-radius: 0 !important;
      z-index: 40 !important;
    }
    /* 工具栏 / 状态：底部两条（场景被盖一部分、但至少能用。） */
    /**
     * ⚠️⚠️ **工具栏与状态栏必须上下堆叠，不能都贴底重叠** ——
     *
     *   原来两个都 `bottom: 0` 且状态栏 z-index 更高（36 > 35），
     *   而工具栏内容比它 34vh 的框还高（实测 313px > 287px），
     *   于是工具栏最下面两行**落进状态栏的覆盖区** ⇒
     *   `elementFromPoint` 拿到的是状态栏的 body ⇒
     *   手机上有 5 个按钮**完全点不到**：
     *       通用着色器 · lilToon · 自动旋转 · 重置视角 · 播放动画
     *   （实测 390×844：12 个可见按钮里 5 个被盖）
     *
     *   ⇒ 状态栏贴底（20vh），工具栏叠在它**上面**（bottom: 20vh），
     *     高度改成自适应、最多 46vh，超了内部滚动 ⇒ 两者永不重叠。
     *   ⇒ 顺带把工具栏的 z-index 提到状态栏之上：万一将来又重叠，
     *     让**可交互**的那条赢过只读的状态条。
     */
    /**
     * ⚠️⚠️ **手机上直接不要状态栏**（用户要求）——
     *
     *   上一版是「状态栏贴底 + 工具栏叠在它上面」，虽然不再互相遮挡，
     *   但两条加起来最多占掉 66vh，手机上场景只剩一条缝 ✓
     *   而且状态栏（网格数 / 三角面 / 动作数）在手机上本来也没什么用 ✓
     *
     *   ⇒ 窄屏下 `#infoWin` 直接不显示，工具栏贴底、最多 56vh ✓

/* ★ 显示模式分段按钮（view / edit。）*/
.seg { display: inline-flex; border: 1px solid #cfd6e4; border-radius: 6px; overflow: hidden; }
.seg > button { border: 0; border-radius: 0; margin: 0; padding: 3px 10px; background: transparent; }
.seg > button + button { border-left: 1px solid #cfd6e4; }
.seg > button.on { background: #3b82f6; color: #fff; font-weight: 600; }
/* ★ 场景浮窗左上角的工具条（显示模式 + 场景按钮。）*/
.scbar {
  /* ⚠️ 挪到**右上** —— 左上和浮窗标题「场景」重合（用户指出的。）*/
  position: absolute; top: 8px; right: 8px; z-index: 6;
  display: inline-flex; gap: 6px; align-items: center;
}
.scbar > button {
  border: 1px solid #cfd6e4; border-radius: 6px; padding: 3px 10px;
  background: rgba(255,255,255,.92); cursor: pointer;
}
#sceneWin { position: relative; }   /* ⚠️ 绝对定位要有个定位祖先。 */
/* ============================================================
 * ★ 最小化 → 左下角停靠（纵向叠放。）
 *
 *   · 每个浮窗标题栏加一个 [—]
 *   · 点了 ⇒ 只留标题、元素挪进 #dock、竖着叠。
 *   · 再点 ⇒ 放回原来的位置和大小。
 * ============================================================ */
#dock {
  /**
   * ⚠️⚠️ **停靠区必须永远在最上层** ——
   *
   *   它是「最小化窗口」的**唯一找回入口** ✓
   *   而 `raiseFloatWin()` 会把被点过的窗口写成内联 z-index（从 100 递增）✓
   *   ⇒ 停靠区原来 z-index 45 ⇒ 一旦点过任何面板（100+），
   *     **最小化的窗口就被盖住、点不回去了** ✓
   *
   *   ⚠️ 和「场景被抬到最上层盖住面板」是**同一个根因**：
   *     递增计数器不认「哪些元素不该参与提升」✓
   *     所以停靠区也加 `!important` 锁在高位（它很小、只占左下角 ✓）
   */
  position: fixed; left: 10px; bottom: 10px; z-index: 999 !important;
  display: flex; flex-direction: column-reverse; gap: 4px;   /* 从下往上叠。 */
  align-items: flex-start; pointer-events: none;
}
#dock > * { pointer-events: auto; }
/* 停靠中的浮窗：位置交给 flex、自己不再定位。 */
#dock > .fw, #dock > .lp {
  position: static !important; left: auto !important; top: auto !important;
  width: auto !important; height: auto !important; min-width: 0 !important;
  resize: none !important; margin: 0 !important;
}
/* 最小化态：除了标题、别的都藏起来。 */
.min > *:not(.fw-title):not(.lp-title) { display: none !important; }
.min { min-height: 0 !important; }
/**
 * ⚠️⚠️ 最小化态下的标题（用户截图里「通用着色器参数」折成了两行 
 *   还带滚动条 ⇒ 布局坏了。）
 *
 *   原因：
 *     · 停靠区是 flex 列、默认会**压缩**子项宽度 ⇒ 文字折行。
 *     · 面板原来的 `height/min(...)` 和 `.lp` 的 overflow 还生效 ⇒ 出滚动条。
 *   ⇒ 用 `width: max-content` + 干掉 overflow。
 */
.min > .fw-title, .min > .lp-title {
  border-radius: 6px; cursor: pointer;
  white-space: nowrap !important;
  width: max-content !important;
  min-width: 0 !important;
  display: flex !important;
  align-items: center;
  gap: 4px;
}
/* 停靠区里的面板：按内容宽、且**不滚动**。 */
#dock > .min {
  width: max-content !important;
  max-width: 92vw !important;
  overflow: hidden !important;
  resize: none !important;
}
/* 标题栏里的 [—] 按钮。 */
.fw-min, .fw-close {
  margin-left: 6px; border: 0; background: transparent; cursor: pointer;
  font: inherit; line-height: 1; padding: 0 3px; opacity: .75;
}
.fw-min:hover, .fw-close:hover { opacity: 1; }
/* ★ 通用着色器参数面板 */
#shaderPanel { left: 16px; top: 120px; width: 360px; height: min(340px, 46vh); z-index: 11; }
#shaderPanel .lp-body { padding: 8px 10px; overflow-y: auto; }
</style>

  <div id="hud">
  <button id="btnUpload" title="上传本地模型文件后直接加载">自定义模型</button>

  </label>

  <label title="光照夹取（lilToon 的 _LightMinLimit / _LightMaxLimit · 默认关）。夹的是**纯光照**（灯光颜色 × 阴影衰减），不含材质色 —— 和 lilToon 的 clamp(fd.lightColor) 对应。效果：太暗的光照被抬到下限（≈ 暗部地板）、太亮的光照被压到上限。⚠️ 上限默认 2.2 是因为我们主光强度是 2.0~2.1（lilToon 默认 1 是按 Unity 主光≈1 定的，照抄会把主光砍一半）。⚠️ 与 lilToon 的差异：three 的环境光是独立相加的、不受这个夹取影响，所以下限拉很高时会比 lilToon 略亮">

const DOCK = document.getElementById('dock');

function addMinBtn(el) {
  if (!el) return;

  if (!title) return;                 // 标题还没建出来 ⇒ 下次扫描再试。
  /**
   * ⚠️⚠️⚠️ **判据必须是「标题里真的有没有那个按钮」· 不能用 `el.__hasMin`** ——
   *
   *   `lilPanel` / `partsPanel` 的内容是**重建**的（`lilPanel.innerHTML = ''`。）
   *   ⇒ 标题被删掉、`ensurePanelTitle` 又建了一个**新的**标题
   *     （新的里面没有 [—]。）

   *     用户看到的就是「lilToon 参数 / 部件 面板没有最小化按钮」。

  if (title.querySelector('.fw-min')) return;

  b.className = 'fw-min';
  b.type = 'button';
  b.title = '最小化（收进左下角 · 再点标题展开）';
  b.textContent = '—';

  /**
   * ⚠️ 标题里还有 `<span class="fw-name">状态</span>`（`.lp-title` 里也有文本节点。）

}

function toggleMin(el) {

    el.__minSave = {

 *   ⇒ 点一下场景（比如想转模型）它就变成 101、102……
 *     ⇒ **盖住所有面板与工具栏** ⇒ 用户报的「所有菜单都看不见了」✓
 *
 *   ⚠️ 我上一轮只改了 `fwRaise()`（那套是加类名 `.raised`）、

/**
 * ★ 清掉「两边都空」的分隔符（`<span class="sep">`。）
 *
 *   ⚠️ 用户指出：控件搬走之后、原来夹在它们之间的分隔符就孤零零留着了。
 *   ⇒ 扫一遍：往左往右各找第一个**不是 sep** 的兄弟 
 *     哪边没有（或不可见。）⇒ 这个分隔没意义 ⇒ 藏起来。
 *   ⚠️ 用 `offsetParent !== null` 判可见（`hidden` 之外、被 CSS 藏起来的也算。）
 */
function cleanOrphanSeps(root) {
  if (!root) return 0;
  const kids = [...root.children];
  const vis = (e) => !!e && !e.hidden && e.offsetParent !== null;
  let hid = 0;
  for (let i = 0; i < kids.length; i++) {
    const el = kids[i];
    if (!el.classList.contains('sep')) continue;
    let a = null, b = null;
    for (let j = i - 1; j >= 0; j--) if (!kids[j].classList.contains('sep')) { a = kids[j]; break; }
    for (let j = i + 1; j < kids.length; j++) if (!kids[j].classList.contains('sep')) { b = kids[j]; break; }
    /**
     * ⚠️⚠️ **两个条件** ——
     *   ① 哪边空了 ⇒ 这个分隔没意义。
     *   ② **左边紧邻的也是 sep** ⇒ 连续重复、只留第一个。
     *
     *   ⚠️ 用户指出的是 ② —— 源码里 `#bgColor` 和 `#btnAuto` 之间

    el.hidden = !keep;

}
function buildShaderPanel() {

 * ★ 分组定位（替代以前的「先平铺、再按正则/标记搬回去」）★
 *
 * ⚠️ 旧设计出过 4 次归位错误：自发光/MatCap 贴图跑进描边组 
 *    阴影颜色/模板模式跑进背光组。 根因是 groupifyLilPanel 先建好分组容器 
 *    之后创建的特殊控件 append 到面板本身、自然落在**最后一组**。
 *
 * 现在：groupifyLilPanel 把每个分组按名字存进 __lilGroupsByName。
 *      建控件时用 lg('组名') 直接拿到那一组的 body、完全不需要搬。
 *      临时切换用 __lgTarget（LP() 优先用它。）
 *
 * ⚠️ 这两个函数和两个变量必须在**顶层**、因为 groupifyLilPanel 也在顶层 
 *    而它拿不到 afterLoad 里的 lilPanel、所以这里现查元素。
 *    （之前用 let 声明在 afterLoad 里、顶层函数引用时直接 ReferenceError。）
 */
var __lilGroupsByName = {};
var __lgTarget = null;
/**
 * ★ 模板模式下拉的「刷新器」注册表
 *
 * ⚠️ 为什么需要：下拉只在**建面板时**读一次 comp/pass 
 *    而手动拖 Comp/Pass 滑杆**不会重建面板**（只调 lilApply。）
 *    ⇒ 于是下拉永远停在旧值、拖到非标准组合也不会显示「（自定义…）」
 *
 *    现在 mkMode 把自己的刷新闭包注册进来、滑杆的 sync() 里统一调一遍。
 *    （比重建面板轻得多、也不丢焦点。）
 */
var __ba3dModeSelects = [];
/** 按分组名取 body、找不到就退回面板本身。 */
function lg(name) {
  var g = __lilGroupsByName[name];
  if (g && g.bodyEl) return g.bodyEl;
  return document.getElementById('lilPanel');
}
/** 当前 append 目标（__lgTarget 优先、否则面板本身。）*/
function LP() { return __lgTarget || document.getElementById('lilPanel'); }

function groupifyLilPanel() {
  // ⚠️ 本函数在顶层、拿不到 afterLoad 里的 const lilPanel、必须现查
  const lilPanel = document.getElementById('lilPanel');
  if (!lilPanel) return;
  const kids = Array.from(lilPanel.children);
  const groups = [];
  let cur = null;
  // ⚠️ 第一个 h4 是面板标题（lilToon 参数 ...），不是可折叠分组。
  //    它和它之后的内容（预设下拉 / 提示）固定在顶部、从第二个 h4 才开始分组。
  // 现在面板里**没有**标题 h4 了（标题栏是 .lp-title、不是 h4），所以每个 h4 都是分组。
  for (const el of kids) {
    if (el.tagName === 'H4') { cur = { head: el, body: [] }; groups.push(cur); }
    else if (cur) cur.body.push(el);
  }
  if (!groups.length) return;

  // 保留第一个 h4 之前的内容（标题 / 预设下拉 / 首条提示）
  const pre = [];
  for (const el of kids) { if (el === groups[0].head) break; pre.push(el); }

  const doc = document.createDocumentFragment();
  for (const el of pre) doc.appendChild(el);
  for (const g of groups) {
    const body = document.createElement('div');
    body.className = 'lpgroup-body hidden';   // 默认折叠
    for (const el of g.body) body.appendChild(el);
    const arrow = document.createElement('span');
    arrow.className = 'lpgroup-arrow';
    arrow.textContent = '\u25b8';   // 默认折叠
    g.head.insertBefore(arrow, g.head.firstChild);
    g.head.classList.add('lpgroup-head');
    g.head.title = '点击折叠 / 展开';
    g.head.onclick = () => {
      const hidden = body.classList.toggle('hidden');
      arrow.textContent = hidden ? '\u25b8' : '\u25be';
    };
    doc.appendChild(g.head);
    doc.appendChild(body);
    g.bodyEl = body;
  }
  lilPanel.appendChild(doc);   // ⚠️ 这里必须用局部变量、LP() 会把容器塞进某个组。

  // 把描边散块从最后一组（背光）挪进「描边」组
  const outG = groups.find((g) => /描边/.test(g.head.textContent || ''));
  const lastG = groups[groups.length - 1];
  if (outG) {
    const re2 = /描边颜色|描边不透明|受光色|受光强度|跳过部件|描边贴图|宽度遮罩|外扩方向|受光生效|受光接收阴影|阴影遮罩预览|着色器里再乘|受光色乘|Cull 模式|方向强度|方向 UV|固定宽度生效|描边贴图UV|描边贴图滚动|描边贴图HSV|模板 Ref|模板 ReadMask|模板 WriteMask|模板 Comp|模板 Pass|模板 Fail|模板 ZFail/;
    // ⚠️ 从**所有分组**里找、不能假设散块都在最后一组（踩过这个坑。）
    const move = [];
    for (const g of groups) {
      if (g === outG) continue;
      for (const el of Array.from(g.bodyEl.children)) { if (re2.test(el.textContent || '')) move.push(el); }
    }
    for (const el of move) outG.bodyEl.appendChild(el);
    if (move.length) console.debug('[lilPanel] 已把 ' + move.length + ' 个描边控件归入「描边」组');

  // MatCap 贴图那两行要归到「MatCap」组（不是描边组）
  const capG = groups.find((g) => /^\s*MatCap\s*$/.test((g.head.textContent || '').replace('▸', '').replace('▾', '').trim()));
  const lastG2 = groups[groups.length - 1];
  if (capG) {
    // ⚠️ 改成按 data-lil 标记找、不再靠文本正则（加一行控件就会失配。）
    const mv2 = [];
    for (const g of groups) {
      if (g === capG) continue;
      for (const el of Array.from(g.bodyEl.children)) {
        if (el.dataset && el.dataset.lil === 'matcap') mv2.push(el);
      }
    }
    for (const el of mv2) capG.bodyEl.appendChild(el);
    if (mv2.length) console.debug('[lilPanel] 已把 ' + mv2.length + ' 个 MatCap 控件归入「MatCap」组');
  }

  // 三层阴影颜色 / 第三层阴影开关 归到「阴影分档」组
  const shG = groups.find((g) => /^阴影分档$/.test((g.head.textContent || '').replace(/[▸▾]/g, '').trim()));
  if (shG) {
    const mv4 = [];
    for (const g of groups) {
      if (g === shG) continue;
      for (const el of Array.from(g.bodyEl.children)) {
        if (el.dataset && el.dataset.lil === 'shadow') mv4.push(el);
      }
    }
    for (const el of mv4) shG.bodyEl.appendChild(el);
    if (mv4.length) console.debug('[lilPanel] 已把 ' + mv4.length + ' 个阴影控件归入「阴影分档」组');
  }

  // Dissolve 控件归到「Dissolve」组
  const disG = groups.find((g) => /^Dissolve$/.test((g.head.textContent || '').replace(/[▸▾]/g, '').trim()));
  if (disG) {
    const mv5 = [];
    for (const g of groups) {
      if (g === disG) continue;
      for (const el of Array.from(g.bodyEl.children)) {
        if (el.dataset && el.dataset.lil === 'dissolve') mv5.push(el);
      }
    }
    for (const el of mv5) disG.bodyEl.appendChild(el);
    if (mv5.length) console.debug('[lilPanel] 已把 ' + mv5.length + ' 个 Dissolve 控件归入「Dissolve」组');
  }

  // MatCap 2nd 归位
  {
    const m2g = groups.find((g) => /^MatCap 2nd$/.test((g.head.textContent || '').replace(/[▸▾]/g, '').trim()));
    if (m2g) {
      const mv7 = [];
      for (const g of groups) {
        if (g === m2g) continue;
        for (const el of Array.from(g.bodyEl.children)) {
          if (el.dataset && el.dataset.lil === 'matcap2nd') mv7.push(el);
        }
      }
      for (const el of mv7) m2g.bodyEl.appendChild(el);
      if (mv7.length) console.debug('[lilPanel] 已把 ' + mv7.length + ' 个「MatCap 2nd」控件归入对应组');
    }
  }

  // 主色层 2nd / 3rd 归位
  for (const [tag, grp] of [['main2nd', /^主色层 2nd$/], ['main3rd', /^主色层 3rd$/]]) {
    const lg = groups.find((g) => grp.test((g.head.textContent || '').replace(/[▸▾]/g, '').trim()));
    if (!lg) continue;
    const mv6 = [];
    for (const g of groups) {
      if (g === lg) continue;
      for (const el of Array.from(g.bodyEl.children)) {
        if (el.dataset && el.dataset.lil === tag) mv6.push(el);
      }
    }
    for (const el of mv6) lg.bodyEl.appendChild(el);
    if (mv6.length) console.debug('[lilPanel] 已把 ' + mv6.length + ' 个「' + tag + '」控件归入对应组');
  }

  // 自发光贴图归到「自发光」组（同样全分组搜索）
  const emiG = groups.find((g) => /^自发光$/.test((g.head.textContent || '').replace(/[▸▾]/g, '').trim()));
  if (emiG) {
    // 同上、按 data-lil 标记。
    const mv3 = [];
    for (const g of groups) {
      if (g === emiG) continue;
      for (const el of Array.from(g.bodyEl.children)) {
        if (el.dataset && el.dataset.lil === 'emission') mv3.push(el);
      }
    }
    for (const el of mv3) emiG.bodyEl.appendChild(el);
    if (mv3.length) console.debug('[lilPanel] 已把 ' + mv3.length + ' 个自发光控件归入「自发光」组');
  }
  }
  /**
   * ★ 把分组按**名字**存起来、供后面的特殊控件直接定位。
   * ⚠️ 以前是「先全部平铺到面板、再用正则/标记搬回去」，出过 4 次归位错误：
   *    自发光贴图 / MatCap 贴图 跑进描边组、阴影颜色与模板模式跑进背光组。
   *    现在改成**建控件时就指定组**、不再需要搬。
   */
  __lilGroupsByName = {};
  for (const g of groups) {
    const nm = (g.head.textContent || '').replace(/[▸▾]/g, '').trim();
    if (nm) __lilGroupsByName[nm] = g;
  }
}

function buildPartsPanel() {
  partsPanel.innerHTML = '';
  ensurePanelTitle(partsPanel);
  let list = [];
  try { list = viewer.listMeshes() || []; }
  catch (e) { console.error('[parts] listMeshes 失败:', e); }
  const h4 = document.createElement('h4');
  h4.textContent = '模型部件（' + list.length + '）';
  partsPanel.appendChild(h4);

  // 批量操作
  const bar = document.createElement('div');
  bar.className = 'actions';
  const mkBtn = (txt, fn) => { const b = document.createElement('button'); b.textContent = txt; b.onclick = fn; return b; };
  bar.appendChild(mkBtn('全显', () => { viewer.setAllMeshesVisible(true); buildPartsPanel(); }));
  bar.appendChild(mkBtn('全隐', () => { viewer.setAllMeshesVisible(false); buildPartsPanel(); }));
  bar.appendChild(mkBtn('刷新', () => buildPartsPanel()));
  partsPanel.appendChild(bar);

  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = '点名字可以「只看这个」（再点一次恢复全部）。改动只影响显示，不改模型数据。';
  partsPanel.appendChild(hint);

  if (!list.length) {
    const e = document.createElement('div');
    e.className = 'hint';
    e.textContent = '还没有加载模型。';
    partsPanel.appendChild(e);
    return;
  }

  list.forEach((it) => {
    const locks = viewer.getMeshLocks();
    const locked = Object.prototype.hasOwnProperty.call(locks, it.path || it.name);
    const row = document.createElement('div');
    row.className = 'mrow';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = it.visible;
    cb.title = it.material + (it.isSkinned ? ' · 蒙皮' : '') + (it.hasOutline ? ' · 有描边' : '');
    cb.onchange = () => {
      viewer.setMeshVisible(it.path || it.name, cb.checked);
      // 已锁定的部件：改动会更新锁定值、重建面板让锁图标显示最新状态。
      if (locked) buildPartsPanel();
    };
    const nm = document.createElement('span');
    nm.className = 'mname';
    // 显示层级路径（Body/mouth 这种、便于写「跳过部件」正则）
    nm.textContent = it.path || it.name;
    // 材质名直接显示出来：Maca 这类模型的「嘴巴」是同一个网格里的另一个材质组，
    // 只有看到材质名才能判断哪个网格包含它
    const matLine = document.createElement('span');
    matLine.className = 'mtri';
    matLine.style.maxWidth = '92px';
    matLine.style.overflow = 'hidden';
    matLine.style.textOverflow = 'ellipsis';
    matLine.style.whiteSpace = 'nowrap';
    matLine.textContent = it.material || '';
    matLine.title = '材质：' + (it.material || '-');
    const full = '网格：' + it.name + '\n路径：' + (it.path || '-') + '\n材质：' + (it.material || '-') +
      (it.isSkinned ? '\n蒙皮：是' : '') + (it.hasOutline ? '\n有描边' : '');
    cb.title = full;
    nm.title = full + '\n点击只看这个部件';
    nm.style.cursor = 'pointer';
    nm.onclick = () => {
      const cur = viewer.listMeshes().filter((x) => x.visible).map((x) => x.path || x.name);
      // ⚠️ 括号必须写清楚：&& 的优先级高于 || 
      //   写成 "a && b || c" 会被解析成 "(a && b) || c" 
      //   而 c = it.name 非空恒真 → 永远走"恢复全部"、点名字就永远没反应。
      if (cur.length === 1 && cur[0] === (it.path || it.name)) viewer.isolateMeshes([]);
      else viewer.isolateMeshes([it.path || it.name]);
      buildPartsPanel();
    };
    const tri = document.createElement('span');
    tri.className = 'mtri';
    tri.textContent = it.triangles >= 1000 ? Math.round(it.triangles / 1000) + 'k' : String(it.triangles);
    row.appendChild(cb);
    row.appendChild(nm);
    row.appendChild(matLine);
    // 锁定按钮：锁上以后该部件的可见性不再被自动逻辑（hideParts / 可选部件 / 骨骼缩放）改动
    const lk = document.createElement('button');
    lk.type = 'button';
    lk.textContent = locked ? '🔒' : '🔓';
    lk.title = locked
      ? '已锁定可见性（' + (it.visible ? '显示' : '隐藏') + '），点击解锁'
      : '锁定当前可见性，之后不被自动隐藏逻辑改动';
    lk.style.padding = '0 5px';
    lk.style.fontSize = '11px';
    lk.style.opacity = locked ? '1' : '0.45';
    lk.onclick = () => {
      // 锁 = 记住当前可见性；解锁 = 交给自动逻辑
      viewer.setMeshLocked(it.path || it.name, locked ? null : it.visible);
      buildPartsPanel();
    };
    row.appendChild(lk);
    row.appendChild(tri);
    partsPanel.appendChild(row);
  });
}

function progressHandler(p) {

async function mount(opts) {
  if (viewer) { viewer.dispose(); viewer = null; }
  container.innerHTML = '';
  /**
 * ★ 主页面是「场景视图」⇒ **显式打开**网格和视角指示器。
 *   （viewer 的默认值现在是关的、那是给嵌入看板用的。）
 */
/**
 * ★ 主页面只**显式打开网格**。
 *   ⚠️ 视角指示器**不再在这里打开** —— 它归「显示模式」预设管：
 *       view ⇒ 只有网格 · edit ⇒ 辅助全开。
 *     在这里再打开会和 view 预设冲突（实测初始状态视角器是 true。）
 */
const __sceneViewOpts = { showGrid: true };
viewer = createViewer(container, Object.assign({ autoRotate: false, onProgress: progressHandler }, __sceneViewOpts, opts));

  // —— 全局可调用（任意脚本 / 控制台都能用。）——
  //   ba3d.exportConfig()     与默认值 diff 后的 model.json（对象）
  //   ba3d.exportConfigJSON() 同上，带缩进的字符串
  //   ba3d.setLilConfig({...}) 任意位置改 lilToon 参数
  // 也暴露为 window.viewer —— 控制台里最常见的写法是 viewer.xxx()
  // （ES module 里的变量默认不在 window 上、所以必须显式挂）
  window.viewer = viewer;
  window.ba3d = viewer;
  window.ba3dExportConfig = () => viewer.exportConfig();
  window.ba3dExportJSON = () => viewer.exportConfigJSON();
  const info = await viewer.load();
  afterLoad(info);
  return info;
}

  //   （报"切了 lilToon 还是打不开参数面板"这类问题时打开它。）
  if (window.__ba3dDebugUI) {
    console.log('[syncRenderUI] getRenderState() =', JSON.stringify(st),
      ' lilOn =', st.render === 'toon' && st.shader === 'lilToon');
  }
  renderMenu.value = st.render;
  shaderMenu.value = st.shader;
  shaderMenu.disabled = st.render !== 'toon';
  shaderMenu.title = st.render === 'toon'
    ? '往 toon 材质里注入什么着色器'
    : '当前材质不是 toon，着色器不生效（选 toon 才可选）';

  // lilToon 参数只在 shader='lilToon' 时可用。 与着色器下拉同一套逻辑
  // ⚠️ 必须用 getElementById 现查，不能引用下面的 const btnLil 
  //    本函数在 btnLil 声明之前就先被调用了一次，直接引用会踩 TDZ（ReferenceError）
  const bl = document.getElementById('btnLil');
  const bp = document.getElementById('lilPanel');
  const lilOn = st.render === 'toon' && st.shader === 'lilToon';
  if (bl) {
    bl.disabled = !lilOn;
    bl.title = lilOn ? 'lilToon 参数（免改 JSON）' : '需要先把「着色器」切到 lilToon 风格';

    /* ⚠️ 「阴影浓淡 / 脸部阴影」是 **cel 的投射阴影软化**、lilToon 有自己的阴影体系
       （三层分档 + _ShadowReceive + _ShadowMainStrength、在 lilToon 参数面板里调）
       viewer 侧已经按 shaderMode 跳过注入、这里再把控件置灰 
       否则调了没反应会以为坏了。 */
    // ⚠️ 现查元素、不能用文件下方那些 const（它们在 868 行才定义、const 不提升。）
    ['celShadow', 'celShadowNum', 'celFaceShadow', 'celFaceShadowNum']
      .map((id) => document.getElementById(id)).forEach((el) => {
      if (!el) return;
      if (el.dataset.origTitle === undefined) el.dataset.origTitle = el.title || '';
      el.disabled = lilOn;
      el.title = lilOn
        ? '只有「卡通」着色器生效、lilToon 有自己的阴影体系（在 lilToon 参数面板里调）'
        : (el.dataset.origTitle || '');
    });
  }

  // 切走着色器时把面板收起来，避免留着一个不生效的面板。
  // ⚠️ 这里曾经是「打不开面板」的元凶、但真因是 afterLoad 重复注册监听器（已修。）
  //    现在 btnLil 用 onclick、一次点击只跑一次、自动收回不再会误伤。
  if (!lilOn && bp && !bp.classList.contains('hidden')) {
    bp.classList.add('hidden');
    if (bl) bl.classList.remove('on');
  }

  // FBX 模型不做描边、按钮置灰并说明原因。
  //   （我们的反壳描边对 FBX 的坐标系/法线/缩放敏感、表现不正确。）
  const bo = document.getElementById('btnOutline');
  if (bo) {
    const fbx = !!viewer.getOutline().fbxDisabled;
    bo.disabled = fbx;
    bo.title = fbx
      ? 'FBX 模型暂不支持描边（反壳描边对 FBX 表现不正确 ）'
      : '描边开关';
    if (fbx && bo.classList.contains('on')) bo.classList.remove('on');
  }
}
syncRenderUI();
renderMenu.addEventListener('change', () => { viewer.setRender(renderMenu.value); syncRenderUI(); });
shaderMenu.addEventListener('change', () => { viewer.setShader(shaderMenu.value); syncRenderUI(); });

/* 旋转基准位置（水平偏移，角色站地面）。滑杆 + 数字输入双向同步 */

}
if (pivotX) pivotX.addEventListener('input', () => applyPivot(pivotX.value, pivotZ.value));
if (pivotZ) pivotZ.addEventListener('input', () => applyPivot(pivotX.value, pivotZ.value));

if (pivotZNum) pivotZNum.addEventListener('input', () => applyPivot(pivotXNum.value, pivotZNum.value));
{ const b = document.getElementById('btnPivotReset'); if (b) b.addEventListener('click', () => applyPivot(0, 0)); }

/* 描边开关 + 粗细（滑杆与数字框双向同步，照基准 X/Z 的写法） */
const btnOutline = document.getElementById('btnOutline');
const outlineWidth = document.getElementById('outlineWidth');
const outlineWidthNum = document.getElementById('outlineWidthNum');

btnOutline.classList.toggle('on', viewer.getOutline().on);
btnOutline.addEventListener('click', () => {
  const on = viewer.setOutline(!viewer.getOutline().on);
  btnOutline.classList.toggle('on', on);
});

const OUTLINE_MIN = Number(outlineWidth.min) || 0;
const OUTLINE_MAX = Number(outlineWidth.max) || 0.02;

function applyOutlineWidth(v) {
  let n = Number(v);
  if (!isFinite(n)) n = Number(outlineWidth.value) || 0;
  n = Math.min(OUTLINE_MAX, Math.max(OUTLINE_MIN, n));
  viewer.setOutlineParams({ thickness: n });
  outlineWidth.value = String(n);
  outlineWidthNum.value = String(n);
  return n;
}

outlineWidth.addEventListener('input', () => applyOutlineWidth(outlineWidth.value));
outlineWidthNum.addEventListener('input', () => applyOutlineWidth(outlineWidthNum.value));
// 数字框里手动输入时要能"从箭头慢慢加"：按上下箭头也能即时反映
outlineWidthNum.addEventListener('change', () => applyOutlineWidth(outlineWidthNum.value));

/* ---------- 光照亮度倍率（打光预设的整体明暗；PBR 与卡通都生效） ---------- */
const lightScale = document.getElementById('lightScale');
const lightScaleNum = document.getElementById('lightScaleNum');
const LIGHT_MIN = Number(lightScale.min) || 0.1;
const LIGHT_MAX = Number(lightScale.max) || 4;

function applyLightScale(v) {
  let n = Number(v);
  if (!isFinite(n)) n = Number(lightScale.value) || 1;
  n = Math.min(LIGHT_MAX, Math.max(LIGHT_MIN, n));
  viewer.setLightingScale(n);
  lightScale.value = String(n);
  lightScaleNum.value = String(n);
  return n;
}

lightScale.addEventListener('input', () => applyLightScale(lightScale.value));
lightScaleNum.addEventListener('input', () => applyLightScale(lightScaleNum.value));
lightScaleNum.addEventListener('change', () => applyLightScale(lightScaleNum.value));

/* ============================================================
 * ★ 场景设置面板（Unity 的 Scene 视图三件套。）
 *
 *   ① 辅助显示：地面网格 / 原点坐标轴 / 主光指示 / 视角指示器
 *   ② 光照：预设 + 主光方位角·仰角·强度·颜色 + 环境光
 *   ③ 相机：位置 / 目标 / 距离 / FOV + 六个轴对齐视角
 *
 * ⚠️ 用 `.lp` 面板 ⇒ 拖动 / 缩放 / 持久化都由现有浮窗底座接管。
 * ============================================================ */
const scenePanelEl = document.getElementById('scenePanel');

/** 小工具：造一行控件（label + 若干元素。）*/
function spRow(label) {
  const d = document.createElement('div');
  d.className = 'sp-row';
  const s = document.createElement('span');
  s.textContent = label;
  d.appendChild(s);
  scenePanelEl.appendChild(d);
  return d;
}
function spGroup(t) {
  const d = document.createElement('div');
  d.className = 'sp-grp';
  d.textContent = t;
  scenePanelEl.appendChild(d);
}
/** 复选框：读写一个布尔。 */
function spCheck(label, get, set) {
  const d = spRow(label);
  const i = document.createElement('input');
  i.type = 'checkbox'; i.className = 'sp-chk'; i.checked = !!get();
  i.addEventListener('change', () => set(i.checked));
  d.appendChild(i);
  return i;
}
/** 滑杆 + 数字框：读写一个数。（面板只做**输入**、不做实时回读 ⇒ 见 syncScenePanel。）*/
function spSlider(label, min, max, step, get, set) {
  const d = spRow(label);
  const r = document.createElement('input');
  r.type = 'range'; r.min = String(min); r.max = String(max); r.step = String(step);
  const n = document.createElement('input');
  n.type = 'number'; n.min = String(min); n.max = String(max); n.step = String(step);
  const cur = Number(get());
  r.value = String(isFinite(cur) ? cur : min);
  n.value = r.value;
  const apply = (v) => {
    let x = Number(v);
    if (!isFinite(x)) x = Number(r.value) || min;
    x = Math.min(max, Math.max(min, x));
    r.value = String(x); n.value = String(x);
    set(x);
  };
  r.addEventListener('input', () => apply(r.value));
  n.addEventListener('input', () => apply(n.value));
  n.addEventListener('change', () => apply(n.value));
  d.appendChild(r); d.appendChild(n);
  return { range: r, num: n, apply };
}
/** 颜色选择器。 */
function spColor(label, get, set) {
  const d = spRow(label);
  const c = document.createElement('input');
  c.type = 'color';
  try { c.value = String(get()); } catch (e) { c.value = '#ffffff'; }
  c.addEventListener('input', () => set(c.value));
  d.appendChild(c);
  return c;
}
/** 一排按钮。 */
function spButtons(label, items) {
  const d = spRow(label);
  const out = [];
  for (const [t, fn] of items) {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = t;
    b.addEventListener('click', fn);
    d.appendChild(b); out.push(b);
  }
  return out;
}

/** 相机相关的控件要能「回读」，单独存起来给定时器刷新。 */
let __spCameraSync = null;

/** 重建整个面板（打开时 + 换光照预设时。）*/
function buildScenePanel() {
  if (!scenePanelEl) return;
  /**
   * ⚠️ **不能直接 `innerHTML = ''`** ——
   *   标题栏（`.lp-title`、由 `ensurePanelTitle` 插成**第一个子节点**。）
   *   也是子节点 ⇒ 会被一起删掉。
   *   而拖动绑定挂在**元素本身**（还在。），但**把手没了** ⇒ 拖不动。
   *
   *   症状（用户实测）：**任何下拉选完 ⇒ 面板丢掉标题栏、再也拖不动**。
   *   因为「预设」「模式」这些下拉的 change 里都会调 `buildScenePanel()`。
   *
   * ⇒ 先把标题栏摘下来、清空、再放回去。
   */
  const __title = scenePanelEl.querySelector(':scope > .lp-title');
  scenePanelEl.innerHTML = '';
  if (__title) scenePanelEl.appendChild(__title);
  const sh = () => viewer.getSceneHelpers();
  const setSh = (o) => viewer.setSceneHelpers(o);

  /* ---- ① 辅助显示 ---- */
  spGroup('辅助显示');

  spCheck('地面网格', () => sh().showGrid, (v) => setSh({ showGrid: v }));
  spCheck('原点坐标轴', () => sh().showAxes, (v) => setSh({ showAxes: v }));
  spCheck('主光指示', () => sh().showLightHelper, (v) => setSh({ showLightHelper: v }));
  spCheck('视角指示器', () => sh().showViewGizmo, (v) => setSh({ showViewGizmo: v }));
  spSlider('网格大小', 2, 24, 1, () => sh().gridSize, (v) => setSh({ gridSize: v, gridDivisions: Math.max(4, Math.round(v * 2)) }));
  spSlider('坐标轴长', 0.4, 4, 0.2, () => sh().axesLength, (v) => setSh({ axesLength: v }));

  /* ---- ② 修正模型位置（原「基准 + 落地微调」合并。） ---- */
  /* ⚠️ 「恢复默认」原来挂在「显示模式」组下、那组删了 ⇒ 挪到辅助显示组末尾。 */
  spButtons('', [['辅助显示恢复默认', () => { viewer.resetHelpers(); buildScenePanel(); }]]);
  spGroup('修正模型位置');
  {
    const d = spRow('模式');
    const sel = document.createElement('select');
    for (const [k, lab] of [['action', 'action（播放。）'], ['edit', 'edit（暂停 + 姿势。）']]) {
      const o = document.createElement('option'); o.value = k; o.textContent = lab;
      if ((viewer.getSceneMode().mode || 'action') === k) o.selected = true;
      sel.appendChild(o);
    }
    sel.addEventListener('change', () => { viewer.setSceneMode(sel.value); buildScenePanel(); });
    d.appendChild(sel);
  }
  spSlider('模型 X', -3, 3, 0.005, () => viewer.getModelOffset().x, (v) => viewer.setModelOffset({ x: v }));
  spSlider('模型 Y', -3, 3, 0.005, () => viewer.getModelOffset().y, (v) => viewer.setModelOffset({ y: v }));
  spSlider('模型 Z', -3, 3, 0.005, () => viewer.getModelOffset().z, (v) => viewer.setModelOffset({ z: v }));
  spButtons('', [
    ['位置归零', () => { viewer.setModelOffset({ x: 0, y: 0, z: 0 }); buildScenePanel(); }],
    ['自动贴地', () => { viewer.snapToGround(); if (window.__spSceneSync) window.__spSceneSync(); }],
  ]);
  /* ⚠️ 原来这里有个「取景中心 X/Z」组 —— 已去掉。
   *    它移的是**相机对准点**、模型和影子都不动 ⇒ 和「修正模型位置」重复且不直观。
   *    用户的要求：「直观把模型移动到 000 · 不动旋转轴 · 动角色位置」
   *    ⇒ `frameModel` 的旋转中心现在直接跟 `modelOffset` 走。
   *    （`viewer.getPivot/setPivot` 还留着、但没人调了。 视为废弃。）
   */  {
    const p = viewer.findEditPose();
    const tip = document.createElement('div');
    tip.className = 'sp-row';
    tip.innerHTML = '<span style="flex:1;color:inherit;opacity:.75">编辑姿势：' + (p ? p : '（本模型无 T-POSE / _Cam ⇒ 停在第 0 帧。）') + '</span>';
    scenePanelEl.appendChild(tip);
  }

  /* ---- ② 光照 ---- */
  spGroup('光照');
{
    const d = spRow('预设');
    const sel = document.createElement('select');
    const cur = viewer.getLightState().preset;
    for (const [k, label] of [['', '（自定义）'], ['day', '白昼'], ['golden', '早晨 / 傍晚'], ['night', '黑夜']]) {
      const o = document.createElement('option'); o.value = k; o.textContent = label;
      if ((cur || '') === k) o.selected = true;
      sel.appendChild(o);
    }
    sel.addEventListener('change', () => {
      if (!sel.value) return;
      viewer.applyLighting(sel.value);
      buildScenePanel();          // 预设会改一堆值 ⇒ 重建面板。
    });
    d.appendChild(sel);
  }
  const LS = () => viewer.getLightState();
  const SL = (o) => viewer.setLightState(o);
  spSlider('主光方位角', 0, 360, 1, () => LS().azimuth, (v) => SL({ azimuth: v }));
  spSlider('主光仰角', -89, 89, 1, () => LS().elevation, (v) => SL({ elevation: v }));
  spSlider('主光强度', 0, 6, 0.05, () => LS().keyIntensity, (v) => SL({ keyIntensity: v }));
  spColor('主光颜色', () => LS().keyColor, (v) => SL({ keyColor: v }));
  spSlider('环境光强度', 0, 2, 0.02, () => LS().hemiIntensity, (v) => SL({ hemiIntensity: v }));
  spColor('环境光·天', () => LS().hemiSky, (v) => SL({ hemiSky: v }));
  spColor('环境光·地', () => LS().hemiGround, (v) => SL({ hemiGround: v }));
  spSlider('边缘光强度', 0, 4, 0.05, () => LS().rimIntensity, (v) => SL({ rimIntensity: v }));
  spSlider('补光强度', 0, 4, 0.05, () => LS().fillIntensity, (v) => SL({ fillIntensity: v }));
  spSlider('曝光', 0.2, 2.5, 0.01, () => LS().exposure, (v) => SL({ exposure: v }));

  /* ---- ③ 相机 ---- */
  spGroup('相机');
  const cams = {};
  for (const [label, key, idx] of [['位置 X', 'position', 0], ['位置 Y', 'position', 1], ['位置 Z', 'position', 2],
                                   ['目标 X', 'target', 0], ['目标 Y', 'target', 1], ['目标 Z', 'target', 2]]) {
    cams[key + idx] = spSlider(label, -50, 50, 0.01,
      () => viewer.getCameraState()[key][idx],
      (v) => { const o = {}; o[key] = viewer.getCameraState()[key].slice(); o[key][idx] = v; viewer.setCameraState(o); });
  }
  const dCam = spSlider('距离', 0.2, 50, 0.01, () => viewer.getCameraState().distance, (v) => viewer.setCameraState({ distance: v }));
  const fovS = spSlider('视场角 FOV', 5, 120, 1, () => viewer.getCameraState().fov, (v) => viewer.setCameraState({ fov: v }));
  spButtons('快捷视角', [
    ['正视', () => viewer.setViewPreset('front')],
    ['后视', () => viewer.setViewPreset('back')],
    ['左视', () => viewer.setViewPreset('left')],
    ['右视', () => viewer.setViewPreset('right')],
  ]);
  spButtons('', [
    ['俯视', () => viewer.setViewPreset('top')],
    ['仰视', () => viewer.setViewPreset('bottom')],
    ['对准原点', () => viewer.setCameraState({ target: [0, 1, 0] })],
  ]);

  /**
   * ⚠️ 相机是**可以被鼠标拖动**的 ⇒ 面板上的数字会过期。
   *   ⇒ 存一个同步函数、面板可见时定时回读（不是每帧、2Hz 就够。）
   */
  /**
   * ⚠️ 自动贴地 / 外部改 modelOffset 之后、面板上的「模型 X/Y/Z」要跟上。
   *   （`viewer.onGroundOffsetChange` 会调它。）
   */
  window.__spSceneSync = () => {
    try {
      const rows = [...scenePanelEl.querySelectorAll('.sp-row')];
      const o = viewer.getModelOffset();
      for (const [label, val] of [['模型 X', o.x], ['模型 Y', o.y], ['模型 Z', o.z]]) {
        const r = rows.find((x) => x.firstChild && x.firstChild.textContent === label);
        const rg = r && r.querySelector('input[type=range]');
        const nm = r && r.querySelector('input[type=number]');
        if (rg && document.activeElement !== rg) rg.value = String(val);
        if (nm && document.activeElement !== nm) nm.value = String(val);
      }
    } catch (e) {}
  };

  __spCameraSync = () => {
    const c = viewer.getCameraState();
    for (const [label, key, idx] of [['', 'position', 0], ['', 'position', 1], ['', 'position', 2],
                                     ['', 'target', 0], ['', 'target', 1], ['', 'target', 2]]) {
      const s = cams[key + idx];
      if (!s) continue;
      // ⚠️ 正在编辑的那个框不要覆盖（否则输入到一半被刷掉。）
      if (document.activeElement !== s.num && document.activeElement !== s.range) {
        const v = String(c[key][idx]);
        s.range.value = v; s.num.value = v;
      }
    }
    if (document.activeElement !== dCam.num && document.activeElement !== dCam.range) {
      dCam.range.value = String(c.distance); dCam.num.value = String(c.distance);
    }
    if (document.activeElement !== fovS.num && document.activeElement !== fovS.range) {
      fovS.range.value = String(c.fov); fovS.num.value = String(c.fov);
    }
  };
}

/** 打开 / 关闭「场景」面板。 */
function toggleScenePanel(force) {
  if (!scenePanelEl) return false;
  const on = force === undefined ? scenePanelEl.classList.contains('hidden') : !!force;
  if (on) {
    buildScenePanel();
    scenePanelEl.classList.remove('hidden');
    /**
     * ⚠️ **不在这里**调 `ensurePanelTitle` / `makePanelDraggable` / `initFloatWin` ——
     *   本段代码在文件里比它们的**定义更靠前** ⇒ 直接调会 `is not defined`。
     *   （实测踩到。 但面板还是开了、只是没接上拖动、很隐蔽。）
     *
     * ⇒ 那三件事由 `enableAllPanelDrag()` 统一做 —— 它
     *   `querySelectorAll('.lp')` **不看可见性**、所以隐藏的 #scenePanel 也接上了。
     *   （启动时跑一次 + 500ms 再跑一次。）
     */
    if (__spCameraSync) __spCameraSync();
    /**
     * ⚠️ 标题栏必须**在内容建好之后**补 ——
     *   `ensurePanelTitle` 对空面板会跳过、而本面板的内容是刚刚才 build 的。
     * ⚠️ 而且 `ensurePanelTitle` / `makePanelDraggable` / `initFloatWin` 在本段代码

   *   ⇒ 最多试 20 次 × 50ms、成功后立刻停。
   */
    (function wireScenePanel(tries) {
      tries = tries || 0;
      if (typeof ensurePanelTitle !== 'function' || typeof makePanelDraggable !== 'function' || typeof initFloatWin !== 'function') {

    })();
  } else scenePanelEl.classList.add('hidden');

  if (b) b.classList.toggle('on', on);
  return on;
}

/* ---------- 脸部阴影 —— 唯一的配置项就是这一档（celFaceShadowMin）
   拖动即设 faceShadowMin；**拖到最右（≥0.95）= 没有面部阴影**（内部据此派生 faceNoShadow，
   同时关掉 receiveShadow，所以 PBR 与卡通两个通路都覆盖）。

/* ---------- 分档色 + 过渡带（阶段 1 ①：「N 段 + 每段各自颜色 + 过渡带宽度」）
   默认**不勾选** ⇒ bandRamp = null ⇒ viewer 走老公式、渲染结果一个字节都不变。
   （所以「cel 模式没变」这条回归保证仍然成立。） ---------- */
const celRampOn = document.getElementById('celRampOn');
const celRampEls = [0, 1, 2, 3].map((i) => document.getElementById('celRamp' + i));
const celBandSoft = document.getElementById('celBandSoft');
const hex2rgb01 = (h) => {
  const v = String(h || '#ffffff');
  return [
    parseInt(v.slice(1, 3), 16) / 255,
    parseInt(v.slice(3, 5), 16) / 255,
    parseInt(v.slice(5, 7), 16) / 255,
  ];
};
const rgb01hex = (c) => '#' + [0, 1, 2].map((i) =>
  Math.round(Math.max(0, Math.min(1, Number(c && c[i]) || 0)) * 255).toString(16).padStart(2, '0')).join('');

function applyCelRamp() {
  const on = !!celRampOn.checked;
  celRampEls.forEach((el) => { el.disabled = !on; });
  celBandSoft.disabled = !on;
  viewer.setCel({
    bandRamp: on ? celRampEls.map((el) => hex2rgb01(el.value)) : null,
    bandSoft: on ? (Number(celBandSoft.value) || 0) : 0,
  });
}
celRampOn.addEventListener('change', applyCelRamp);
celRampEls.forEach((el) => el.addEventListener('input', applyCelRamp));
celBandSoft.addEventListener('input', applyCelRamp);
/** 从配置同步到 UI（加载模型 / 导入 JSON 后调用） */
function syncCelRampUI() {
  const c = viewer.getCel();
  const r = Array.isArray(c.bandRamp) && c.bandRamp.length >= 2 ? c.bandRamp : null;
  celRampOn.checked = !!r;
  if (r) celRampEls.forEach((el, i) => { el.value = rgb01hex(r[Math.min(i, r.length - 1)]); });
  celBandSoft.value = String(Number(c.bandSoft) || 0);
  celRampEls.forEach((el) => { el.disabled = !r; });
  celBandSoft.disabled = !r;
}
syncCelRampUI();

 * ⚠️ `#infoWin` 的 CSS 默认本来就是**右下角**（ide / 引擎的信息位。）：

const FW_KEY = 'ba3d-layout-v2';

    width: Math.round(r.width), height: Math.round(r.height),

/** 把矩形夹回视口内（留 4px 边距、标题栏不能被拖出屏幕。）*/

    /* ══════════════════════════════════════════════════════════

    try {

      erow.appendChild(shSel);
      LP().appendChild(erow);
      const hrow = document.createElement('div'); hrow.className = 'row'; hrow.id = 'lilExportHint';
      hrow.style.cssText = 'font-size:11px;opacity:.72;line-height:1.5';
      function updateHint() {
        try {
          const mat = (typeof lilCurMat === 'function' ? lilCurMat() : '') || undefined;
          const manual = shSel.value || undefined;
          const info = viewer.lilShaderInfo(mat, manual);

      updateHint();
      LP().appendChild(hrow);
      const dlTxt = (text, name) => {

      const modelBase = () => {

      };
      const optOf = () => ({
        category: catSel.value === '' ? undefined : Number(catSel.value),

      });
      const brow = document.createElement('div'); brow.className = 'row';
      const bOne = document.createElement('button'); bOne.type = 'button'; bOne.textContent = '导出当前材质';

      bOne.onclick = () => {
        try {

          const base = modelBase();
          const o = optOf();

          console.info('[export] 已导出 ' + nm + '.asset');

      };
      const bAll = document.createElement('button'); bAll.type = 'button'; bAll.textContent = '导出全部材质';
      bAll.title = '每个材质各导一个 .asset（批量）\n分类按材质名自动猜（可先用左边的下拉强制指定）';
      bAll.onclick = () => {

      LP().appendChild(brow);
      console.debug('[lilPanel] 导出区已就位（分类 ' + eopt.categories.length + ' · 着色器组 ' + Object.keys(eopt.shadersByMode).length + ' · 材质 ' + eopt.materials.length + '）');
    } catch (e) {
      console.error('[export] lilToon 面板导出区构建失败（面板其余部分不受影响）:', e);
    }
    const phint = document.createElement('div');
    phint.className = 'hint';
    phint.textContent = '预设来自 lilToon 官方 Presets';
    LP().appendChild(phint);
  
    const hint = document.createElement('div');
    hint.className = 'hint';
    hint.textContent = '需先把「着色器」切到 lilToon 风格。四项特性默认关闭（强度 0），调大即生效。';
    LP().appendChild(hint);
  
    for (const [path, label, min, max, step] of LIL_CTRL) {
      if (label === null) {
        const h = document.createElement('h4');
        h.textContent = path;
        LP().appendChild(h);
        continue;
      }
      const row = document.createElement('div');
      row.className = 'row';
      const name = document.createElement('span');
      name.textContent = label;
      row.appendChild(name);
  
      const v0 = lilGet(cur, path);
      const range = document.createElement('input');
      range.type = 'range';
      range.min = min; range.max = max; range.step = step;
      // ⚠️ 必须显式转数字：
      //   outline.enable 是布尔 false，直接 range.value = false 会被赋成字符串 "false"，
      //   对 <input type=range> 非法 → 浏览器退回默认值（上界 1）
      //   → 表现是「显示启用但实际没启用，要拉 1→0→1 才生效」
      range.value = (v0 === null || v0 === undefined) ? min
        : (typeof v0 === 'boolean' ? (v0 ? 1 : 0) : Number(v0));
      const num = document.createElement('input');
      num.type = 'number';
      num.min = min; num.max = max; num.step = step;
      num.value = range.value;
      const sync = (v) => {
        const f = Math.max(Number(min), Math.min(Number(max), Number(v)));
        range.value = f; num.value = f;
        lilApply(path, f);
        // ★ 让「模板模式」下拉跟上（拖 Comp/Pass 时它会变成「（自定义…）」）
        for (const rf of __ba3dModeSelects) rf();
      };
      range.addEventListener('input', () => sync(range.value));
      num.addEventListener('change', () => sync(num.value));
      row.appendChild(range);
      row.appendChild(num);
      LP().appendChild(row);
    }

    /**
     * ★ 在这里建分组容器、时机很关键：
     *    必须在 LIL_CTRL 循环**之后**（那时才存在各个 h4。）
     *    也必须在所有特殊控件**之前**（它们要按名字找组。）
     *
     * ⚠️ 踩过的坑：把这次调用删掉之后、分组容器一个都没建 
     *    __lilGroupsByName 是空的、lg() 全部回退到面板本身、面板变平。
     */
    groupifyLilPanel();
  
    // 第三层阴影开关（颜色为 null 表示不用第三层）
    __lgTarget = lg('阴影分档');
    const r3 = document.createElement('div');
    r3.className = 'row';
    const c3 = document.createElement('input');
    c3.type = 'checkbox';
    c3.id = 'lil3rd';
    c3.checked = !!cur.shadow3rdColor;
    c3.addEventListener('change', () => lilS({ shadow3rdColor: c3.checked ? [0, 0, 0] : null }));
    const l3 = document.createElement('span');
    l3.textContent = '第三层阴影';
    l3.style.flex = '1';
    r3.appendChild(l3); r3.appendChild(c3);
    r3.dataset.lil = 'shadow';
    LP().appendChild(r3);

    // —— 阴影颜色（三层、每层 RGB + alpha）——
    __lgTarget = lg('阴影分档');
    //   ⚠️ alpha 就是「这一层多强」（lilToon 的 _ShadowColor.a / _Shadow2ndColor.a / _Shadow3rdColor.a）
    //      19 个官方预设里有 11 个的 shadow2ndColor alpha = 0（= 第二层关闭）
    //      之前实现只取 RGB、那些预设全变成「纯黑满强度」，暗得离谱。
    // ⚠️ 自己算 hex、不能用文件下方那个 hex()（const 不提升、TDZ 会报
    //    "can't access lexical declaration 'hex' before initialization"）
    const rgb2hex = (c) => '#' + [0, 1, 2].map((i) => {
      const v = Math.max(0, Math.min(255, Math.round(Number(c[i]) * 255)));
      return v.toString(16).padStart(2, '0');
    }).join('');
    const mkShadowColor = (label, key, hint) => {
      const row = document.createElement('div');
      row.className = 'row';
      const sp = document.createElement('span');
      sp.textContent = label;
      const ci = document.createElement('input');
      ci.type = 'color';
      ci.style.flex = '0 0 auto';
      const ai = document.createElement('input');
      ai.type = 'range'; ai.min = 0; ai.max = 1; ai.step = 0.01; ai.style.flex = '1';
      ai.title = '这一层多强：0 = 关闭该层，1 = 满强度';
      const an = document.createElement('input');
      an.type = 'number'; an.min = 0; an.max = 1; an.step = 0.01; an.style.width = '52px';
      const cur = lilG()[key];
      const isArr = Array.isArray(cur) && cur.length >= 3;
      const a0 = (isArr && cur.length >= 4 && isFinite(Number(cur[3]))) ? Math.max(0, Math.min(1, Number(cur[3]))) : 1;
      ci.value = isArr ? rgb2hex([cur[0], cur[1], cur[2]]) : '#ffffff';
      ai.value = String(a0); an.value = String(a0);
      const rgbNow = () => {
        const v = ci.value;
        return [parseInt(v.slice(1, 3), 16) / 255, parseInt(v.slice(3, 5), 16) / 255, parseInt(v.slice(5, 7), 16) / 255];
      };
      const apply = (a3) => { const c = rgbNow(); lilS({ [key]: [c[0], c[1], c[2], Math.max(0, Math.min(1, Number(a3)))] }); };
      ci.oninput = () => apply(ai.value);
      const setA = (v) => {
        const f = Math.max(0, Math.min(1, Number(v)));
        ai.value = String(f); an.value = String(f); apply(f);
      };
      ai.oninput = () => setA(ai.value);
      an.onchange = () => setA(an.value);
      row.appendChild(sp); row.appendChild(ci); row.appendChild(ai); row.appendChild(an);
      row.dataset.lil = 'shadow';   // 供 groupify 归入「阴影分档」组
      __lgTarget = lg('阴影分档');
      LP().appendChild(row);
      if (hint) {
        const hh = document.createElement('div');
        hh.className = 'hint';
        hh.textContent = hint;
        hh.dataset.lil = 'shadow';
        LP().appendChild(hh);
      }
    };
    mkShadowColor('阴影色', 'shadowColor');
    mkShadowColor('第二层色', 'shadow2ndColor', '滑杆 = 第二层多强（0 = 关闭这一层、lilToon 的 _Shadow2ndColor.a）');
    mkShadowColor('第三层色', 'shadow3rdColor', '滑杆 = 第三层多强（需先勾上「第三层阴影」）');

    // —— 模板模式下拉（不存配置、从 comp/pass 推导、和 lilToon 编辑器一样。）——
    (function () {
      /**
       * lilToon 的 4 个模式（lilInspector.cs:4389-4392、只看 Comp 与 Pass。）：
       *   0 Normal         Comp=Always(8)   Pass=Keep(0)      不参与模板
       *   1 Writer         Comp=Always(8)   Pass=Replace(2)   写标记
       *   2 Reader         Comp=NotEqual(6) Pass=Keep(0)      **避开**标记区域
       *   3 Reader(Invert) Comp=Equal(3)    Pass=Keep(0)      **只显示在**标记区域
       * ⚠️ 2 和 3 的名字与直觉**相反**、所以标签里写清语义。
       * （Reader(Fade) 需要 TwoPass 透明、我们没有两趟渲染、不做。）
       */
      const MODES = [
        { ci: 8, pi: 0, label: '不参与模板（Comp=总是、Pass=保持）' },
        { ci: 8, pi: 2, label: '写标记：把这里标记为 Ref 值（Pass=替换）' },
        { ci: 6, pi: 0, label: '避开标记：只在没有标记的地方显示（Comp=不等于）' },
        { ci: 3, pi: 0, label: '只显示在标记处：只在有标记的地方显示（Comp=等于）' },
      ];
      const mkMode = (groupKey, tag, hint, pre, label) => {
      // ⚠️ 描边的字段是**平铺**的（stencilComp、不是 comp。），所以要带前缀。
      // ⚠️ 要拼成**驼峰**、'stencil' + 'comp' 会得到 'stencilcomp'、字段其实叫 stencilComp。
      //    拼错的后果是读不到 → NaN、而且写入的字段名也是错的 → 静默无效。
      // ⚠️ **不能**用「首字母大写」的通用驼峰拼接 
      //    zfail → stencilZfail、但配置字段其实叫 **stencilZFail**（F 也大写。）
      //    所以用**显式映射表**、而且让 check-panel.mjs 去核对字段名真实存在。
      const K = (n) => {
        if (!pre) return n;
        const MAP = { comp: 'Comp', pass: 'Pass', fail: 'Fail', zfail: 'ZFail' };
        return pre + (MAP[n] || n.charAt(0).toUpperCase() + n.slice(1));
      };
        const row = document.createElement('div');
        row.className = 'row';
        const sp = document.createElement('span');
        sp.textContent = label || '模板模式';
        const sel = document.createElement('select');
        sel.style.flex = '1';
        MODES.forEach((m, i2) => {
          const o = document.createElement('option');
          o.value = String(i2);
          o.textContent = m.label;
          sel.appendChild(o);
        });
        // ★ 刷新闭包：建面板时调一次、之后滑杆变化也调它。
        const customOpt = document.createElement('option');
        customOpt.value = '-1';
        const refresh = () => {
          const cur = lilG()[groupKey] || {};
          const ci = Math.round(Number(cur[K('comp')]));
          const pi = Math.round(Number(cur[K('pass')]));
          const hit = MODES.findIndex((m) => m.ci === ci && m.pi === pi);
          if (hit >= 0) {
            if (customOpt.parentNode) customOpt.remove();
            sel.value = String(hit);
          } else {
            const f = (v) => (isFinite(v) ? v : '?');
            customOpt.textContent = '（自定义：Comp=' + f(ci) + '、Pass=' + f(pi) + '）';
            if (!customOpt.parentNode) sel.appendChild(customOpt);
            sel.value = '-1';
          }
        };
        refresh();
        __ba3dModeSelects.push(refresh);
        sel.onchange = () => {
          const i2 = Number(sel.value);
          if (i2 < 0) return;
          const m = MODES[i2];
          // ⚠️ 只改 Comp/Pass/Fail/ZFail、保留用户设的 Ref 与两个 Mask。
          lilS({ [groupKey]: { [K('comp')]: m.ci, [K('pass')]: m.pi, [K('fail')]: 0, [K('zfail')]: 0 } });
        };
        row.appendChild(sp); row.appendChild(sel);
        row.dataset.lil = tag;
        // ★ 按 tag 定位到目标分组、不再靠事后搬。
        if (tag === 'stencil') __lgTarget = lg('Stencil 模型');
        if (tag === 'outlineStencil') __lgTarget = lg('Stencil 描边');
        LP().appendChild(row);
        if (hint) {
          const hh = document.createElement('div');
          hh.className = 'hint'; hh.textContent = hint; hh.dataset.lil = tag;
          LP().appendChild(hh);
        }
      };
      mkMode('stencil', 'stencil', '选好模式后、记得把「启用」调到 1、并把「Ref」设成你要的标记值（Writer 和 Reader 两边要一致。）');
      // ⚠️ 标签要能区分、两个下拉现在都在「Stencil」组里。
      mkMode('outline', 'outlineStencil', '描边的模板模式、需要先把本组的「启用」调到 1、并让「Ref」与本体一致（Writer 和 Reader 两边要一样。）', 'stencil');
    })();

    // —— 描边贴图的 UV 变换 / HSV（_OutlineTex_ST / _OutlineTex_ScrollRotate / _OutlineTexHSVG）——
    __lgTarget = lg('描边 Outline');
    //   ⚠️ 文案要能被 groupify 的描边正则匹配到、否则会掉进「背光」组。
    (function () {
      const oc = () => (lilG().outline || {});
      const mkVec4 = (label, field, defs, titles, hint) => {
        const row = document.createElement('div');
        row.className = 'row';
        const sp = document.createElement('span');
        sp.textContent = label;
        sp.style.flex = '0 0 92px';
        row.appendChild(sp);
        const cur = Array.isArray(oc()[field]) && oc()[field].length >= 4 ? oc()[field] : defs;
        const ins = [];
        titles.forEach((t, i) => {
          const inp = document.createElement('input');
          inp.type = 'number'; inp.step = 0.01; inp.value = String(Number(cur[i]));
          inp.title = t;
          inp.style.width = '46px';
          inp.onchange = () => {
            const v = ins.map((e2) => Number(e2.value) || 0);
            lilS({ outline: { [field]: v } });
          };
          ins.push(inp);
          row.appendChild(inp);
        });
        __lgTarget = lg('描边 Outline');
        LP().appendChild(row);
        if (hint) {
          const hh = document.createElement('div');
          hh.className = 'hint'; hh.textContent = hint;
          LP().appendChild(hh);
        }
      };
      mkVec4('描边贴图UV', 'texST', [1, 1, 0, 0],
        ['tiling X（_OutlineTex_ST.x）', 'tiling Y', 'offset X', 'offset Y'],
        '_OutlineTex_ST：uv * tiling + offset（默认 1,1,0,0、全默认时走 three 原生贴图路径。）');
      mkVec4('描边贴图滚动', 'texScrollRotate', [0, 0, 0, 0],
        ['scroll X（每秒）', 'scroll Y（每秒）', 'angle（弧度）', 'angleSpeed（弧度/秒）'],
        '_OutlineTex_ScrollRotate：滚动 + 旋转（默认 0,0,0,0。），动画播放时会动起来。');
      mkVec4('描边贴图HSV', 'texHSVG', [0, 1, 1, 1],
        ['色相偏移（0~1）', '饱和度倍率', '明度倍率', 'gamma'],
        '_OutlineTexHSVG：lilToneCorrection（默认 0,1,1,1、等于不调整。）');
    })();

    // —— 装饰层的「混合遮罩」贴图（_MatCapBlendMask / _MatCap2ndBlendMask / _EmissionBlendMask）——
    //   ⚠️ lilToon 只有这三处有 BlendMask、Rim / Backlight 都没有（已核对源码。）
    (function () {
      const mkMask = (groupKey, tag, hint) => {
        const row = document.createElement('div');
        row.className = 'row';
        const sp = document.createElement('span');
        sp.textContent = '混合遮罩';
        const btn = document.createElement('button');
        btn.type = 'button'; btn.textContent = '选择文件'; btn.style.flex = '0 0 auto';
        const clr = document.createElement('button');
        clr.type = 'button'; clr.textContent = '清除'; clr.style.flex = '0 0 auto';
        const nm = document.createElement('span');
        nm.style.cssText = 'flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#6b7385;font-size:10.5px';
        const cur = (lilG()[groupKey] && lilG()[groupKey].blendMask) || '';
        nm.textContent = cur ? String(cur).split('/').pop() : '（未设置 = 全区域生效）';
        const fi = document.createElement('input');
        fi.type = 'file'; fi.accept = 'image/*'; fi.style.display = 'none';
        fi.onchange = () => {
          const f = fi.files && fi.files[0];
          if (!f) return;
          lilS({ [groupKey]: { blendMask: URL.createObjectURL(f) } });
          nm.textContent = f.name;
        };
        btn.onclick = () => fi.click();
        clr.onclick = () => { lilS({ [groupKey]: { blendMask: null } }); nm.textContent = '（未设置 = 全区域生效）'; };
        row.appendChild(sp); row.appendChild(btn); row.appendChild(clr); row.appendChild(nm); row.appendChild(fi);
        row.dataset.lil = tag;

  if (btnLil && lilPanel) {

          if (window.__ba3dDebugUI) console.debug('[lilPanel] 已打开，控件 ' + lilPanel.querySelectorAll('input,select').length + ' 个');

function setPicked(key, file) {
  picked[key] = file || null;

async function doLoadPicked() {
  if (!picked.model) return;
  const btn = document.getElementById('btnDoLoad');
  btn.disabled = true;
  setMsg('准备中…');

  // 释放上一轮的 blob URL
  while (objectUrls.length) URL.revokeObjectURL(objectUrls.pop());

  const opts = { modelUrl: URL.createObjectURL(picked.model) };
  objectUrls.push(opts.modelUrl);

  // 把原始文件名带上：blob: URL 没有后缀，查看器据此（或嗅探文件头）判定格式
  opts.modelName = picked.model.name;

  // 贴图：文件名 → blob URL。FBX 里存的路径不可用，按文件名兜住。
  if (textureFiles.size) {
    const map = {};
    for (const [name, f] of textureFiles) {
      const u = URL.createObjectURL(f);
      objectUrls.push(u);
      map[name] = u;
    }
    opts.textureMap = map;
  }

  if (picked.mouth) {
    opts.mouthAtlasUrl = URL.createObjectURL(picked.mouth);
    objectUrls.push(opts.mouthAtlasUrl);
  }

  if (picked.config) {
    let conf;
    try {
      conf = JSON.parse(await picked.config.text());
    } catch (e) {
      setMsg('配置 JSON 解析失败：' + e.message, true);
      btn.disabled = false;
      return;
    }
    // 上传的配置里模型/贴图路径失去了解析基准（原本是相对配置文件所在目录），
    // 一律改用上传的文件，所以把这两个字段删掉
    if (conf.model) { delete conf.model.url; delete conf.model.mouthAtlas; }
    opts.config = conf;
  }

  setMsg('加载中…');
  showLoading('模型加载中…');
  try {
    await mount(opts);
    /**
   * ★★ lilToon 参数：**手动选的优先**、没选就走自动探测（用户定的规则。）
   *   ① 手上选了 `.lilToon.json` ⇒ 直接套。
   *   ② 没选 ⇒ `viewer.probeLilConfig(主配置的 URL)`
   *        · 探测顺序：模型名.lilToon.json → 主JSON名.lilToon.json
   *        · 都没有 ⇒ **出厂默认** + 控制台提示「未找到配置」
   */
  try {
    if (picked.lilConfig) {
      /**
       * ★★ **按扩展名分流**（用户的需求：和 Unity 互通。）
       *
       *   `.json`           ⇒ 我们自己的 lilToon 配置（原路。）
       *   `.asset` / `.mat` ⇒ **Unity 的 lilToon 预设 / 材质**。
       *
       *   ⚠️ 同一个输入框收三种文件、**不给用户增加「该点哪个」的负担**。
       *     扩展名是客观事实、比让用户选类型可靠。
       */
      const __nm = String(picked.lilConfig.name || '');
      const __txt = await picked.lilConfig.text();
      if (/\.(asset|mat)$/i.test(__nm)) {
        const __r = viewer.importLilPreset(__txt);
        if (__r.ok) {
          console.info('[lilToon] 已套用 Unity 预设「' + (__r.name || __nm) + '」：源 ' + __r.total
            + ' 条 ⇒ 套用 ' + __r.applied + ' 项 · 未识别 ' + __r.skipped.length + ' 个属性名（我们没实现。）');
          setMsg('已套用 Unity 预设「' + (__r.name || __nm) + '」：套用 ' + __r.applied + ' 项'
            + (__r.skipped.length ? '，其余 ' + __r.skipped.length + ' 个属性我们没实现（保持默认。）' : ''));
        } else {
          setMsg('Unity 预设导入失败：' + __r.reason, true);
          console.warn('[lilToon] 预设导入失败：', __r);
        }
      } else {
        const lo = JSON.parse(__txt);
        viewer.applyLilConfigJSON(lo);
        console.info('[lilToon] 已套用手动选择的 ' + __nm);
      }
    } else if ((viewer.exportConfig().renderer || {}).lilToon?.use) {
      await viewer.probeLilConfig(null);
    }
  } catch (e) { console.warn('[lilToon] 参数套用失败：', e); }
  window.__ba3dLilProbed = false;   // ★ 手动载入 ⇒ 允许再探一次。
  setMsg('已加载：' + picked.model.name);
  } catch (err) {
    console.error('自定义模型加载失败：', err);
    setMsg('加载失败：' + (err && err.message ? err.message : err), true);
    showLoadingError(err);
  } finally {
    btn.disabled = false;
  }
}

/* ---------- 首次加载的收尾 ---------- */
setPicked('model', null);
</script>
<!-- ★ 最小化后的浮窗停靠区（左下角 · 纵向叠放。） -->
<div id="dock"></div>
</body>
